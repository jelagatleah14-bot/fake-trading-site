<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeX Pro — Advanced Crypto Trading Platform</title>
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-card: #181a20;
            --bg-input: #2b3139;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --primary: #f0b90b;
            --green: #0ecb81;
            --red: #f6465d;
            --border: #2f3336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 60px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 20px;
            color: var(--primary);
        }

        .market-summary {
            display: flex;
            gap: 24px;
            font-size: 13px;
        }

        .ticker-val {
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-login {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-register {
            background-color: var(--primary);
            color: #000;
        }

        /* Main App Grid Layout */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 300px 320px;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-card);
            border: 0.5px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.5px;
        }

        /* Chart Canvas Area */
        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chart-placeholder {
            flex: 1;
            background: linear-gradient(180deg, rgba(14,203,129,0.05) 0%, rgba(11,14,17,0) 100%);
            position: relative;
        }

        /* Simulated Positions Window */
        .positions-area {
            height: 220px;
            border-top: 2px solid var(--border);
        }

        .pos-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        .pos-table th, .pos-table td {
            padding: 10px 12px;
        }

        .pos-table th {
            color: var(--text-muted);
            font-weight: normal;
            font-size: 11px;
        }

        /* Order Book Live System */
        .ob-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 12px;
            font-size: 12px;
            position: relative;
        }

        .ob-bg-red { position: absolute; right: 0; top: 0; bottom: 0; background: rgba(246,70,93,0.08); width: 45%; z-index: 1;}
        .ob-bg-green { position: absolute; right: 0; top: 0; bottom: 0; background: rgba(14,203,129,0.08); width: 60%; z-index: 1;}
        .ob-val { z-index: 2; }

        .spread-bar {
            padding: 8px 12px;
            font-weight: 600;
            text-align: center;
            background-color: var(--bg-main);
            margin: 4px 0;
        }

        /* Trading Form / Order Panel */
        .order-form {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tab-group {
            display: flex;
            background-color: var(--bg-main);
            border-radius: 4px;
            padding: 2px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
        }

        .tab.active-buy { color: var(--green); background-color: var(--bg-card); }

        .input-box {
            background-color: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .input-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 70%;
            text-align: right;
            font-weight: 600;
        }

        .input-label { color: var(--text-muted); font-size: 12px; }

        .btn-action {
            background-color: var(--green);
            color: #fff;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
        }

        /* --- EDUCATIONAL ESCAPE OVERLAY (The Intervention) --- */
        .alert-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .alert-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .alert-modal {
            background-color: #1e222d;
            border: 2px solid var(--primary);
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .alert-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .alert-title {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .alert-text {
            color: #f0f4f8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: left;
        }

        .danger-points {
            background-color: rgba(246,70,93,0.1);
            border-left: 4px solid var(--red);
            padding: 12px;
            text-align: left;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .danger-points li {
            margin-left: 20px;
            margin-top: 6px;
        }

        .btn-close-alert {
            background-color: var(--primary);
            color: #000;
            padding: 12px 30px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header>
        <div class="logo-section">
            <span style="font-size:24px;">⚡</span> TradeX Pro
        </div>
        <div class="market-summary">
            <div><span style="color:var(--text-muted)">BTC/USDT</span> <span class="ticker-val" id="top-price" style="color:var(--green)">$67,482.31</span></div>
            <div><span style="color:var(--text-muted)">24h Change</span> <span class="ticker-val" style="color:var(--green)">+3.14%</span></div>
            <div><span style="color:var(--text-muted)">24h Volume</span> <span class="ticker-val">42,910.45 BTC</span></div>
        </div>
        <div class="nav-buttons">
            <button class="btn btn-login INTERCEPT">Log In</button>
            <button class="btn btn-register INTERCEPT">Register</button>
        </div>
    </header>

    <!-- Main App Layout Grid -->
    <div class="dashboard-container">
        
        <!-- Left: Charts and Positions -->
        <div style="display: flex; flex-direction: column; overflow: hidden;">
            <div class="panel chart-area">
                <div class="panel-header">BTC / USDT · 15m · Spot Market</div>
                <div class="chart-placeholder" id="chart-canvas">
                    <!-- Dynamic SVG Line representing a fake real-time graph -->
                    <svg style="width:100%; height:100%; position:absolute; left:0; top:0;">
                        <path id="graph-line" d="M 0 200 L 100 180 L 200 220 L 300 140 L 400 190 L 500 110 L 600 130 L 700 80 L 800 100" fill="none" stroke="#0ecb81" stroke-width="2.5"></path>
                    </svg>
                </div>
            </div>
            
            <div class="panel positions-area">
                <div class="panel-header">Open Positions (2 active)</div>
                <table class="pos-table">
                    <thead>
                        <tr>
                            <th>Asset</th>
